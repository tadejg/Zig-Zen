# The Docker image that will be used to build your app
image: ubuntu:24.04
create-pages:
  pages:
    # The folder that contains the files to be exposed at the Page URL
    publish: zig-out/docs
  rules:
    # This ensures that only pushes to the default branch will trigger
    # a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  # Functions that should be executed before the build script is run
  before_script:
    - apt update && apt install -y apt-transport-https xz-utils
    - wget
      https://ziglang.org/builds/zig-x86_64-linux-0.16.0-dev.1859+212968c57.tar.xz
    - tar-xf zig-x86_64-linux-0.16.0-dev.1859+212968c57.tar.xz
  script:
    - ./zig-x86_64-linux-0.16.0-dev.1859+212968c57/zig build docs
